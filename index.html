<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f3f6f4">
<title>河北农业大学校园问答助手 · AI</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app" id="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-text">
        <span class="brand-name">校园问答助手</span>
        <span class="brand-sub">河北农业大学</span>
      </span>
    </div>
    <div class="header-actions">
      <span class="ai-status" id="aiStatus"><i class="status-dot"></i><span id="aiStatusText">AI 就绪</span></span>
      <button class="icon-btn" id="btnNewChat" aria-label="新建对话" title="新建对话"></button>
      <button class="icon-btn" id="btnChats" aria-label="历史对话" title="历史对话"></button>
      <button class="icon-btn" id="btnSettings" aria-label="设置" title="设置"></button>
    </div>
  </header>

  <!-- 问答：首页 -->
  <main class="app-main">
    <section class="view active" id="chatView">
      <div class="chat-scroll" id="chatScroll">
        <div class="welcome" id="welcome">
          <div class="welcome-mark" id="welcomeMark"></div>
          <div class="welcome-kicker">AI 驱动 · 官网资料支撑</div>
          <h1>有问题，直接问 AI</h1>
          <p class="welcome-desc">AI 会先理解你的问题，再从河北农业大学官网资料中找到依据，给出可溯源的答案。</p>
          <div class="ability-row">
            <span class="ability"><span class="ability-ico" data-icon="refresh"></span>理解连续追问</span>
            <span class="ability"><span class="ability-ico" data-icon="link"></span>答案可溯源</span>
            <span class="ability"><span class="ability-ico" data-icon="shield"></span>不确定就直说</span>
          </div>
          <div class="quick-label">试试这样问</div>
          <div class="chip-row" id="quickChips"></div>
        </div>
        <div class="chat-log" id="chatLog"></div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="qInput" rows="1" placeholder="输入你的问题…" enterkeyhint="send"></textarea>
          <button class="send-btn" id="btnSend" aria-label="发送"></button>
        </div>
        <div class="composer-note">AI 依据官网知识库作答 · 可连续追问 · Enter 发送</div>
      </div>
    </section>

    <!-- 知识库：第二个标签页，底层支撑 -->
    <section class="view" id="kbView">
      <div class="kb-scroll">
        <div class="kb-head">
          <div class="kb-head-top">
            <div>
              <h2>知识库</h2>
              <p>学校官网可核实信息，是 AI 回答的事实依据。</p>
            </div>
            <span class="kb-count" id="kbCount"></span>
          </div>
          <label class="kb-search">
            <span id="kbSearchIcon"></span>
            <input type="search" id="kbSearch" placeholder="搜索条目、关键词…" autocomplete="off">
          </label>
        </div>
        <div class="cat-chips" id="catChips"></div>
        <div class="item-list" id="itemList"></div>
        <div class="kb-foot" id="kbFoot"></div>
      </div>
    </section>

    <!-- 条目详情（知识库标签内） -->
    <section class="view" id="detailView">
      <div class="detail-scroll">
        <button class="detail-back" id="detailBack"></button>
        <div class="detail-card" id="detailWrap"></div>
      </div>
    </section>
  </main>

  <!-- 底部标签栏（桌面端浮于顶部中间） -->
  <nav class="main-tabs" id="mainTabs" aria-label="主导航">
    <button class="tab-btn active" data-tab="chat"><span class="tab-ico" data-icon="chat"></span><span>问答</span></button>
    <button class="tab-btn" data-tab="kb"><span class="tab-ico" data-icon="book"></span><span>知识库</span></button>
  </nav>

</div>

<!-- 历史对话抽屉 -->
<div class="drawer-mask hidden" id="chatsMask">
  <aside class="drawer" id="chatsDrawer">
    <div class="drawer-head">
      <h3>历史对话</h3>
      <button class="icon-btn" id="closeChats" aria-label="关闭"></button>
    </div>
    <button class="new-chat-btn" id="drawerNewChat"></button>
    <div class="chat-list" id="chatList"></div>
    <div class="drawer-foot" id="chatsFoot"></div>
  </aside>
</div>

<!-- 设置（高级选项，AI 已内置无需填写） -->
<div class="modal-mask hidden" id="settingsModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="settingsTitle">设置</h3>
      <button class="icon-btn" id="closeSettings" aria-label="关闭"></button>
    </div>
    <div class="builtin-box">
      <div class="builtin-ico" id="builtinIco"></div>
      <div class="builtin-text">
        <strong>AI 服务已内置并默认启用</strong>
        <span>接口、模型与密钥已预置，打开即可使用，无需填写。</span>
      </div>
    </div>
    <label class="switch-row"><span>启用 AI 问答</span><input type="checkbox" id="aiEnabled"></label>
    <label class="switch-row"><span>注入官网知识库（RAG）</span><input type="checkbox" id="aiUseKB"></label>
    <label class="switch-row"><span>流式输出</span><input type="checkbox" id="aiStream"></label>
    <div class="modal-actions">
      <button class="btn-ghost" id="aiTest">测试连接</button>
      <button class="btn-ghost" id="btnFeedback">意见反馈</button>
      <button class="btn-primary" id="aiSave">保存</button>
    </div>
    <div class="msg-line" id="aiTestMsg"></div>
  </div>
</div>

<!-- 反馈 -->
<div class="modal-mask hidden" id="feedbackModal">
  <div class="modal">
    <div class="modal-head">
      <h3>意见反馈</h3>
      <button class="icon-btn" id="closeFeedback" aria-label="关闭"></button>
    </div>
    <p class="modal-desc">反馈仅保存在本机浏览器。可评价答案、上报过时信息或提出建议。</p>
    <label class="field-label" for="fbType">反馈类型</label>
    <select id="fbType" class="field">
      <option value="wrong">答案有误 / 已过时</option>
      <option value="missing">没找到想要的信息</option>
      <option value="suggest">功能建议</option>
      <option value="other">其他</option>
    </select>
    <label class="field-label" for="fbText">具体内容</label>
    <textarea id="fbText" class="field" rows="4" placeholder="请描述你遇到的问题或建议…"></textarea>
    <div class="modal-actions">
      <button class="btn-ghost" id="fbExport">导出 JSON</button>
      <button class="btn-primary" id="fbSubmit">提交</button>
    </div>
    <div class="msg-line" id="fbMsg"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/icons.js"></script>
<script src="data/knowledge-base.js"></script>
<script src="assets/ai.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
